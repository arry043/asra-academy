# ASRA Academy — local development Redis configuration.
# Used later by BullMQ (background jobs), scheduled tasks, notifications and caching.

bind 0.0.0.0
protected-mode no
port 6379

# Persistence: append-only file stored in the named volume mounted at /data.
dir /data
appendonly yes
appendfsync everysec

# BullMQ requires that job keys are never evicted.
maxmemory-policy noeviction

loglevel notice
